<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priority inbox mockup</title>
<style>
:root {
  color-scheme: dark;
  --background: #0a0a0a;
  --foreground: #f5f5f5;
  --card: #111111;
  --popover: #111111;
  --border: #191919;
  --ring: #346bf1;
  --primary: #346bf1;
  --muted-foreground: #818181;
  --destructive: #fb414a;
  --destructive-foreground: #ff6467;
  --warning: #fe9a00;
  --warning-foreground: #ffb900;
  --success-foreground: #34d399;
  --info-foreground: #60a5fa;
  --success: #10b981;
  --info: #3b82f6;
  --radius: 0.625rem;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --background: #fcfcfc;
    --foreground: #27272a;
    --card: #ffffff;
    --popover: #ffffff;
    --border: #e4e4e7;
    --ring: #1b4ed8;
    --primary: #1b4ed8;
    --muted-foreground: #71717b;
    --destructive: #fb2c36;
    --destructive-foreground: #c10007;
    --warning: #fe9a00;
    --warning-foreground: #bb4d00;
    --success-foreground: #047857;
    --info-foreground: #1d4ed8;
  }
}

html {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  padding: 8px;
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
}

*{box-sizing:border-box}
.mock{font:14px var(--font-sans);max-width:400px;margin:0 auto;--side:color-mix(in srgb,var(--card) 74%,var(--background));--label:var(--muted-foreground);--hover:color-mix(in srgb,var(--foreground) 8%,transparent);--selection:color-mix(in srgb,var(--foreground) 11%,transparent);color:var(--foreground)}
.sidebar{position:relative;background:var(--side);border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px 8px;min-width:0}
button,input{font:inherit;color:inherit}
button,summary{cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.toolbar{position:relative;z-index:2;display:flex;gap:5px;align-items:center;min-height:34px;margin:1px 0 8px}
.quick-projects{display:flex;gap:1px;align-items:center;flex:1}
.toolbar button,.project-picker>summary{border:1px solid transparent;background:none;border-radius:5px;font-size:12px;padding:4px 7px;color:var(--label);white-space:nowrap;line-height:16px}
.toolbar button:hover,.project-picker>summary:hover{background:var(--hover)}
.toolbar button[aria-pressed=true],.project-picker[open]>summary,.project-picker[data-filtered]>summary{border-color:var(--border);background:var(--hover);color:var(--foreground)}
.toolbar .read-filter{flex:none;min-width:60px;border-color:var(--border)}
.toolbar .read-filter[data-state]:not([data-state=all]){background:var(--hover);color:var(--foreground)}
.toolbar .star-filter[aria-pressed]{display:grid;place-items:center;flex:none;width:25px;height:25px;padding:0;color:var(--label)}
.star-filter .line-icon{width:13px;height:13px}
.star-filter[aria-pressed=true] .line-icon{fill:currentColor}
.project-picker{position:relative;flex:none}
.project-picker>summary{display:grid;place-items:center;width:25px;height:25px;padding:0;list-style:none}
.project-picker>summary::-webkit-details-marker,.shelf>summary::-webkit-details-marker{display:none}
.caret{width:6px;height:6px;border-bottom:1px solid var(--label);border-right:1px solid var(--label);transform:rotate(45deg) translateY(-2px);flex:none}
.sidebar:has(.project-picker[open]){min-height:238px}
.popup,.row-menu{position:absolute;padding:5px;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 18px #0003;display:grid;gap:3px}
.popup{top:calc(100% + 5px);right:0;width:min(217px,calc(100vw - 40px))}
.popup input[type=search],.row-menu input{background:var(--background);border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12px;min-width:0;width:100%}
.toolbar .popup button,.popup label{width:100%;font-size:12px;text-align:left;border:0;background:none;padding:5px 6px;border-radius:4px;cursor:pointer}
.popup label{display:flex;align-items:center;justify-content:space-between}
.popup label input{margin:0;accent-color:var(--primary)}
.toolbar .popup button:hover,.popup label:hover{background:var(--hover)}
.shelf>summary{font-size:12px;color:var(--label);margin:0;padding:6px 10px 4px;display:flex;justify-content:space-between;gap:4px;font-weight:500;align-items:center;min-height:29px;list-style:none}
.shelf-count{font-weight:400;font-variant-numeric:tabular-nums}
.group+.group{margin-top:4px}
.rows{list-style:none;margin:0;padding:0}
.rows li{margin:0;padding:2px 0}
.row{cursor:pointer;height:78px;border-radius:6px;width:100%;display:flex;flex-direction:column;justify-content:center;min-width:0;text-align:left;padding:8px 10px}
.row:hover{background:var(--hover)}
.row[aria-current=true]{background:var(--selection)}
.topline,.meta,.slim{display:flex;align-items:center;gap:6px;text-align:left;min-width:0}
.topline{height:20px;color:var(--label);font-size:12px;width:100%}
.project-name,.title,.branch{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;min-width:0}
.project-name,.branch,.slim .title{flex:1}
.project-icon{flex:none;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;font-size:8px;font-weight:650;color:var(--project-color);background:color-mix(in srgb,var(--project-color) 15%,var(--side))}
.title{font-size:14px;font-weight:500;margin-top:4px;line-height:20px}
.recede:not([aria-current=true]) .title{opacity:.75;font-weight:400}
.status,.age{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.done,.open{color:var(--success-foreground,var(--success))}
.done{font-weight:500}
.meta{color:var(--label);margin-top:2px;height:16px;font-size:12px}
.pr{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.merged{color:light-dark(#7c3aed,#c4b5fd)}
.asset{display:inline-block;flex:none;width:12px;height:12px;background-color:currentColor;mask:var(--icon) center / contain no-repeat}
.provider{margin-left:auto;width:14px;height:14px;color:var(--foreground);opacity:.6}
.provider.claude{color:#d97757}
.working-glyph,.line-icon{width:16px;height:16px}
.line-icon{display:inline-block;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status-slot{display:grid;grid-template-columns:auto auto;height:100%;align-items:center;margin-left:auto}
.rest-status,.row-actions{grid-area:1 / 2;justify-self:end}
.rest-status{display:flex;align-items:center}
.row-actions{display:flex;align-items:center;opacity:0;pointer-events:none;white-space:nowrap}
.row-actions button,.star-button{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:3px 5px;color:var(--label);font-size:12px;line-height:14px;border-radius:4px}
.row-actions button:hover,.star-button:hover{color:var(--foreground);background:var(--hover)}
.row-actions .line-icon,.star-button .line-icon{width:14px;height:14px}
.row-actions [data-action=snooze] .line-icon{width:12px;height:12px}
.star-button{grid-area:1 / 1;opacity:0;pointer-events:none;--star-color:currentColor}
.star-button[data-star=green]{--star-color:light-dark(#15803d,#4ade80)}
.star-button[data-star=yellow]{--star-color:light-dark(#a16207,#facc15)}
.star-button[data-star=blue]{--star-color:light-dark(#1d4ed8,#60a5fa)}
.star-button .line-icon{stroke:var(--star-color)}
.star-button:not([data-star=off]) .line-icon{fill:var(--star-color)}
.star-button:not([data-star=off]),
.row:has(.status-slot :focus-visible) .star-button,.row[data-show-actions] .star-button,
.row:has(.status-slot :focus-visible) .row-actions,.row[data-show-actions] .row-actions{opacity:1;pointer-events:auto}
.row:has(.status-slot :focus-visible) .rest-status,.row[data-show-actions] .rest-status{visibility:hidden}
@media(any-hover:hover){
  .row:hover .status-slot .star-button,.row:hover .row-actions{opacity:1;pointer-events:auto}
  .row:has(.row-actions):hover .rest-status{visibility:hidden}
}
.sidebar:has(#row-menu:not([hidden])){min-height:340px}
.row-menu{z-index:3;gap:1px;width:max-content;min-width:170px;max-width:calc(100% - 16px);padding:4px}
.row-menu button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;min-height:26px;padding:4px 8px;border-radius:4px;font-size:12px;white-space:nowrap}
.row-menu button:enabled:hover,.row-menu button:focus-visible{background:var(--hover)}
.row-menu button:disabled{cursor:default}
.row-menu .line-icon{width:14px;height:14px;color:var(--label)}
.row-menu .menu-end{margin-left:auto;color:var(--label);font-size:11px}
.menu-divider{margin-top:2px;border-top:1px solid var(--border);padding-top:2px}
.shelves{margin-top:6px;padding-top:4px;border-top:1px solid var(--border)}
.shelf:hover>summary{background:var(--hover);border-radius:6px}
.shelf summary .name{display:flex;align-items:center;gap:8px}
.shelf .caret{transform:rotate(-45deg)}
.shelf[open] .caret{transform:rotate(45deg)}
.slim{height:36px;flex-direction:row;gap:10px;color:var(--label)}
.slim .title{margin:0}
.slim .star-button{flex:none}
.empty{padding:15px 10px;color:var(--label);font-size:12px}
[hidden]{display:none!important}
@media(max-width:390px){.toolbar button{padding-inline:5px}.toolbar{gap:4px}}
@media(max-width:340px){.toolbar button{padding-inline:3px;font-size:11px}.toolbar .read-filter{min-width:54px}.toolbar{gap:3px}.toolbar .star-filter[aria-pressed],.project-picker>summary{width:22px}}
@media(max-width:290px){.toolbar{flex-wrap:wrap}.quick-projects{flex-basis:100%}.project-picker{margin-left:auto}}
</style>
</head>
<body>
<div class="mock">
  <aside class="sidebar" aria-label="Thread sidebar">
    <header class="toolbar">
      <div class="quick-projects" aria-label="Quick project filters" role="group">
        <button type="button" data-project="Reports">Reports</button>
        <button type="button" data-project="Platform">Platform</button>
        <button type="button" data-project="Docs">Docs</button>
      </div>
      <button type="button" class="read-filter" id="read-filter" data-state="all">All</button>
      <button type="button" class="star-filter" id="star-filter" aria-label="Starred" title="Starred" aria-pressed="false"></button>
      <details class="project-picker" id="project-picker">
        <summary aria-label="All projects" title="All projects"><span aria-hidden="true" class="caret"></span></summary>
        <div class="popup">
          <input type="search" id="project-search" placeholder="Search projects" aria-label="Search projects">
          <button type="button" id="clear-projects">All projects</button>
          <div id="projects"></div>
        </div>
      </details>
    </header>
    <details id="priority" class="group shelf" open>
      <summary>
        <span class="name"><span aria-hidden="true" class="caret"></span>Priority</span>
        <span class="shelf-count"></span>
      </summary>
      <ul class="rows"></ul>
    </details>
    <details id="other" class="group shelf" open>
      <summary>
        <span class="name"><span aria-hidden="true" class="caret"></span>Everything else</span>
        <span class="shelf-count"></span>
      </summary>
      <ul class="rows"></ul>
    </details>
    <p id="empty" class="empty" hidden>No matching threads.</p>
    <div class="shelves" id="shelves">
      <details id="working" class="shelf"><summary><span class="name"><span aria-hidden="true" class="caret"></span>Working</span><span class="shelf-count"></span></summary><ul class="rows"></ul></details>
      <details id="snoozed" class="shelf" open><summary><span class="name"><span aria-hidden="true" class="caret"></span>Snoozed</span><span class="shelf-count"></span></summary><ul class="rows"></ul></details>
      <details id="settled" class="shelf" open><summary><span class="name"><span aria-hidden="true" class="caret"></span>Settled</span><span class="shelf-count"></span></summary><ul class="rows"></ul></details>
    </div>
    <div class="row-menu" id="row-menu" role="menu" aria-label="Thread actions" hidden></div>
  </aside>
</div>

function nextReadState(state) {
  return readStates[(readStates.indexOf(state) + 1) % readStates.length];
}
const projectButtons = [...document.querySelectorAll("[data-project]")];
const sidebar = document.querySelector(".sidebar");
const picker = byId("project-picker");
const menu = byId("row-menu");
const starFilter = byId("star-filter");
let filter = "all";
let starredOnly = false;
let activeThread = "";
let menuRow = null;
let menuPosition = null;

function glyph(name) {
  return '<svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">' + glyphPaths[name] + '</svg>';
}
function icon(name, classes, label) {
  const accessibility = label ? 'role="img" aria-label="' + label + '" title="' + label + '"' : 'aria-hidden="true"';
  return '<span ' + accessibility + ' class="asset ' + classes + '" style="--icon:url(' + icons[name] + ')"></span>';
}
function project(thread) {
  return '<span aria-hidden="true" class="project-icon" style="--project-color:var(--' + thread.color + '-foreground,var(--' + thread.color + '))">' + thread.initials + '</span>';
}
function pullRequest(thread) {
  if (thread.pr === undefined) return "";
  const merged = thread.prState === "merged";
  return '<span class="pr" title="' + (merged ? "Merged" : "Open") + ' pull request #' + thread.pr + '">' + icon(merged ? "git-merge" : "git-pull-request-arrow", merged ? "merged" : "open") + thread.pr + '</span>';
}
function rowButton(action, label, glyphName, caption = "") {
  return '<button type="button" data-action="' + action + '" aria-label="' + label + '" title="' + label + '">' + glyph(glyphName) + caption + '</button>';
}
function nextStar(state) {
  return starStates[(starStates.indexOf(state) + 1) % starStates.length];
}
function starLabel(state) {
  return "Star " + state + ". " + (nextStar(state) === "off" ? "Clear star" : "Set " + nextStar(state) + " star");
}
function starButton(thread) {
  const state = thread.star ?? "off";
  const label = starLabel(state);
  return '<button type="button" class="star-button" data-action="star" data-star="' + state + '" aria-label="' + label + '" title="' + label + '">' + glyph("star") + '</button>';
}
function row(thread) {
  const claude = thread.provider === "claudeAgent";
  const provider = icon("provider-" + thread.provider, "provider" + (claude ? " claude" : ""), claude ? "Claude Code" : "Codex");
  const unread = thread.unread && !thread.shelf;
  let status = '<span class="age">' + thread.age + '</span>';
  if (thread.shelf === "working") status = '<span class="status">' + icon("circle-dashed", "working-glyph") + 'Working ' + thread.age + '</span>';
  if (thread.shelf === "snoozed") status = '<span class="status">' + glyph("clock") + 'Snoozed</span>';
  if (unread) status = '<span class="status done">' + glyph("settle") + 'Done</span>';
  const access = thread.title + ", " + thread.project + (unread ? ", Done, unread result" : "");
  const selected = activeThread === thread.id ? ' aria-current="true"' : '';
  const classes = "row" + (thread.shelf === "settled" ? " slim" : "") + (thread.unread ? "" : " recede");
  const start = '<li><div role="button" tabindex="0" data-thread="' + thread.id + '" aria-label="' + access + '"' + selected + ' class="' + classes + '">';
  const title = '<span class="title">' + thread.title + '</span>';
  if (thread.shelf === "settled") {
    const star = hasStar(thread) ? starButton(thread) : "";
    return start + project(thread) + title + star + status + '</div></li>';
  }
  const actions = thread.shelf === "snoozed"
    ? rowButton("wake", "Wake thread", "clock", "Wake")
    : rowButton("snooze", "Snooze thread", "clock") + rowButton("settle", "Settle thread", "check", "Settle");
  return start + '<span class="topline">' + project(thread) + '<span class="project-name">' + thread.project + '</span><span class="status-slot">' + starButton(thread) + '<span class="rest-status">' + status + '</span><span class="row-actions">' + actions + '</span></span></span>' + title + '<span class="meta"><span class="branch">' + thread.branch + '</span>' + pullRequest(thread) + provider + '</span></div></li>';
}
function hasStar(thread) {
  return (thread.star ?? "off") !== "off";
}
function inScope(thread) {
  return (!starredOnly || hasStar(thread)) && (projectScope.size === 0 || projectScope.has(thread.project));
}
function renderSection(id, threads) {
  const container = byId(id);
  container.hidden = threads.length === 0;
  container.querySelector(".shelf-count").textContent = threads.length;
  container.querySelector(".rows").innerHTML = threads.map(row).join("");
  return !container.hidden;
}
function renderShelf(id) {
  const threads = filter === "all" ? demo.filter(thread => thread.shelf === id && inScope(thread)) : [];
  return renderSection(id, threads);
}
function refresh() {
  const visible = demo.filter(thread => !thread.shelf && inScope(thread) && (filter === "all" || (filter === "unread" ? thread.unread : !thread.unread)));
  renderSection("priority", visible.filter(thread => thread.priority));
  renderSection("other", visible.filter(thread => !thread.priority));
  const hasShelf = ["working", "snoozed", "settled"].map(renderShelf).some(Boolean);
  byId("shelves").hidden = !hasShelf;
  byId("empty").hidden = visible.length > 0 || hasShelf;
  byId("empty").textContent = starredOnly && projectScope.size === 0 && filter === "all" ? "No starred threads." : "No matching threads.";
  starFilter.setAttribute("aria-pressed", String(starredOnly));
  for (const button of projectButtons) button.setAttribute("aria-pressed", String(projectScope.has(button.dataset.project)));
  readFilter.dataset.state = filter;
  readFilter.textContent = readLabels[filter];
  const readLabel = "Read filter: " + readLabels[filter] + ". Switch to " + readLabels[nextReadState(filter)] + ".";
  readFilter.setAttribute("aria-label", readLabel);
  readFilter.title = readLabel;
  for (const checkbox of byId("projects").querySelectorAll("input")) checkbox.checked = projectScope.has(checkbox.value);
  picker.toggleAttribute("data-filtered", [...projectScope].some(name => !projectButtons.some(button => button.dataset.project === name)));
  picker.querySelector("summary").title = projectScope.size ? "Projects: " + [...projectScope].join(", ") : "All projects";
}
starFilter.innerHTML = glyph("star");
starFilter.addEventListener("click", () => {
  starredOnly = !starredOnly;
  refresh();
});
readFilter.addEventListener("click", () => {
  filter = nextReadState(filter);
  refresh();
});
for (const button of projectButtons) button.addEventListener("click", () => {
  const name = button.dataset.project;
  if (projectScope.has(name)) projectScope.delete(name);
  else projectScope.add(name);
  refresh();
});
byId("projects").innerHTML = projectNames.map(name => '<label><span>' + name + '</span><input type="checkbox" value="' + name + '"></label>').join("");
byId("projects").addEventListener("change", event => {
  if (event.target.checked) projectScope.add(event.target.value);
  else projectScope.delete(event.target.value);
  refresh();
});
byId("clear-projects").addEventListener("click", () => { projectScope.clear(); refresh(); });
byId("project-search").addEventListener("input", event => {
  const query = event.target.value.toLowerCase().trim();
  for (const label of byId("projects").children) label.hidden = !label.textContent.toLowerCase().includes(query);
});
picker.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    picker.open = false;
    picker.querySelector("summary").focus();
  }
});
function threadFor(row) {
  return demo.find(item => item.id === row.dataset.thread);
}
function focusRow(id) {
  const threadRow = sidebar.querySelector('[data-thread="' + id + '"]');
  const collapsed = threadRow?.closest("details:not([open])");
  (collapsed?.querySelector("summary") ?? threadRow ?? readFilter).focus();
}
function openThread(row) {
  const thread = threadFor(row);
  activeThread = thread.id;
  updateThread(row, {unread:false});
}
function updateThread(row, changes) {
  const thread = threadFor(row);
  Object.assign(thread, changes);
  closeMenu();
  refresh();
  focusRow(thread.id);
}
function cycleStar(row, button) {
  const thread = threadFor(row);
  thread.star = nextStar(thread.star ?? "off");
  button.dataset.star = thread.star;
  const label = starLabel(thread.star);
  button.title = label;
  button.setAttribute("aria-label", label);
  if (!hasStar(thread) && starredOnly) {
    refresh();
    starFilter.focus();
  } else if (!hasStar(thread) && thread.shelf === "settled") {
    button.remove();
    row.focus();
  }
}
function menuItem(action, label, glyphName = "", end = "", disabled = false) {
  return '<button type="button" role="menuitem" data-menu-action="' + action + '"' + (disabled ? " disabled" : "") + '>' + (glyphName ? glyph(glyphName) : "") + '<span>' + label + '</span>' + (end ? '<span class="menu-end">' + end + '</span>' : "") + '</button>';
}
const menuDivider = '<div class="menu-divider" role="separator"></div>';
function rowMenuContent(thread) {
  const branch = thread.branch ? menuItem("new", "New thread on " + thread.branch, "new", "", true) : "";
  return branch + menuItem("pin", "Pin thread", "pin", "", true) +
    menuItem(thread.shelf === "settled" ? "unsettle" : "settle", thread.shelf === "settled" ? "Un-settle thread" : "Settle thread", "settle") +
    (thread.shelf === "snoozed" ? menuItem("wake", "Wake thread", "clock") : menuItem("snooze", "Snooze", "clock", "›")) +
    menuDivider + menuItem("rename", "Rename thread", "pencil", "", true) +
    menuItem("regenerate", "Regenerate title", "refresh", "", true) +
    menuItem("unread", "Mark unread", "mail") +
    menuDivider + menuItem("copy", "Copy", "copy", "›", true) +
    menuItem("archive", "Archive thread", "archive", "", true);
}
function snoozeMenuContent() {
  return menuItem("snooze-preset", "In 1 hour", "", "14:30") +
    menuItem("snooze-preset", "In 3 hours", "", "16:30") +
    menuItem("snooze-preset", "This evening", "", "18:00") +
    menuItem("snooze-preset", "Tomorrow", "", "09:00") +
    menuItem("snooze-preset", "Next week", "", "Mon 09:00") +
    menuDivider + menuItem("custom", "Custom…");
}
function positionMenu() {
  const side = sidebar.getBoundingClientRect();
  const x = Math.max(7, Math.min(menuPosition.x - side.left, side.width - menu.offsetWidth - 8));
  const y = Math.max(7, Math.min(menuPosition.y - side.top, side.height - menu.offsetHeight - 8));
  menu.style.left = x + "px";
  menu.style.top = y + "px";
}
function showMenu(row, kind, position, keepHover = false) {
  closeMenu();
  picker.open = false;
  menuRow = row;
  menuPosition = position;
  if (keepHover) row.setAttribute("data-show-actions", "");
  menu.innerHTML = kind === "snooze" ? snoozeMenuContent() : rowMenuContent(threadFor(row));
  menu.setAttribute("aria-label", kind === "snooze" ? "Snooze thread" : "Thread actions");
  menu.hidden = false;
  positionMenu();
  menu.querySelector("button:not(:disabled)").focus({preventScroll:true});
}
function closeMenu(returnFocus = false) {
  if (!menuRow) return;
  const row = menuRow;
  menu.hidden = true;
  row.removeAttribute("data-show-actions");
  menuRow = null;
  if (returnFocus) row.focus();
}
function showRowMenu(row, x, y) {
  const rect = row.getBoundingClientRect();
  showMenu(row, "thread", {x:x || rect.left + 12,y:y || rect.top + 24});
}
sidebar.addEventListener("contextmenu", event => {
  const row = event.target.closest("[data-thread]");
  if (!row) return;
  event.preventDefault();
  showRowMenu(row, event.clientX, event.clientY);
});
sidebar.addEventListener("keydown", event => {
  const row = event.target.closest("[data-thread]");
  if (!row || event.target !== row) return;
  if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
    event.preventDefault();
    showRowMenu(row);
  } else if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openThread(row);
  }
});
sidebar.addEventListener("click", event => {
  const row = event.target.closest("[data-thread]");
  if (!row) return;
  const button = event.target.closest("[data-action]");
  if (!button) {
    openThread(row);
    return;
  }
  switch (button.dataset.action) {
    case "star":
      cycleStar(row, button);
      break;
    case "snooze": {
      const rect = button.getBoundingClientRect();
      showMenu(row, "snooze", {x:rect.right - 155,y:rect.bottom + 4}, true);
      break;
    }
    case "settle":
      updateThread(row, {shelf:"settled"});
      break;
    case "wake":
      updateThread(row, {shelf:null});
      break;
  }
});
menu.addEventListener("click", event => {
  const action = event.target.closest("[data-menu-action]")?.dataset.menuAction;
  if (!action || !menuRow) return;
  if (action === "snooze") {
    showMenu(menuRow, "snooze", menuPosition);
  } else if (action === "custom") {
    menu.innerHTML = '<input aria-label="Snooze until" type="datetime-local">' + menuItem("snooze-preset", "Snooze");
    positionMenu();
    menu.querySelector("input").focus();
  } else if (action === "unread") {
    updateThread(menuRow, {unread:true});
  } else if (action === "snooze-preset") {
    const custom = menu.querySelector("input");
    if (!custom || custom.value) updateThread(menuRow, {shelf:"snoozed"});
    else custom.focus();
  } else {
    updateThread(menuRow, {shelf:action === "settle" ? "settled" : null});
  }
});
menu.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    event.preventDefault();
    closeMenu(true);
  } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    if (event.target.matches("input")) return;
    event.preventDefault();
    const items = [...menu.querySelectorAll("button:not(:disabled)")];
    const offset = event.key === "ArrowDown" ? 1 : -1;
    const index = items.indexOf(document.activeElement);
    items[(index + offset + items.length) % items.length].focus();
  }
});
document.addEventListener("pointerdown", event => {
  if (!menu.hidden && !menu.contains(event.target)) closeMenu();
  if (picker.open && !picker.contains(event.target)) picker.open = false;
});
addEventListener("resize", () => { if (menuRow) positionMenu(); });
refresh();
</script>
</body>
</html>
